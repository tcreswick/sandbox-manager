# sandbox fix-up mapping
#
# Format: <regex>  <script>
#   - the last whitespace-separated token on each line is the script
#     filename; everything before it is the regex (so the regex may
#     contain literal spaces, e.g. '^Ubuntu 22\.')
#   - first match wins
#   - regex is matched against the PRETTY_NAME field of /etc/os-release
#     inside the freshly-started container
#   - lines starting with '#' and blank lines are ignored
#   - the trailing '.*' line is the catch-all fallback
#
# This file is yours: edit freely. sandbox will not overwrite it.

^Ubuntu\b                              debian.sh
^Debian\b                              debian.sh
^Arch\b                                arch.sh
^Manjaro\b                             arch.sh
^Fedora\b                              fedora.sh
^(Rocky|AlmaLinux|CentOS|Red Hat)\b    fedora.sh
^Alpine\b                              alpine.sh
.*                                     default.sh
